name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU-only PyTorch (Linux; smaller and faster than the default CUDA build)
        if: runner.os == 'Linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies (real resolution of requirements.txt)
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and UI smoke tests
        run: python -m unittest discover -s tests -v

  real-model:
    name: Real YOLO inference (downloads weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - name: Detect objects in a sample photo with real weights, load the bundled mask model, exercise tracking
        env:
          YOLO_REAL_TESTS: "1"
        run: python -m unittest tests.test_real_model -v

  docker:
    name: Docker image builds and serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yolo-studio .
      - name: Start the container and wait for Streamlit's health endpoint
        run: |
          docker run -d --name studio -p 8501:8501 yolo-studio
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then echo "healthy after $i checks"; exit 0; fi
            sleep 3
          done
          docker logs studio
          exit 1
